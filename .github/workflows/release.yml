name: Release

# タグ vX.Y.Z を push すると、app/companion を署名ビルドして Play の内部テストへ配信する。
# workflow_dispatch では配信手前（復元・テスト・ビルド）までを検証できる（配信は tag push 時のみ）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "確認用バージョン名（例 0.1.0）。配信はされず、ビルド検証のみ。"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version name
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${INPUT_VERSION:-0.0.0-dispatch}" >> "$GITHUB_ENV"
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/keystore-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Unit tests (guard)
        run: ./gradlew :app:testDebugUnitTest :companion:testDebugUnitTest

      - name: Build release bundles
        run: ./gradlew :app:bundleRelease :companion:bundleRelease

      - name: Prepare Play release notes (whatsnew)
        if: github.ref_type == 'tag'
        run: |
          NOTES_FILE="docs/release-notes-${VERSION_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE が見つかりません。リリースノートを用意してからタグを打ってください。"
            exit 1
          fi
          mkdir -p whatsnew
          awk '
            /Play Console「最新情報」用/ {seen=1; next}
            seen && /^```/ {c++; next}
            seen && c==1 {print}
          ' "$NOTES_FILE" > whatsnew/whatsnew-ja-JP
          if [ ! -s whatsnew/whatsnew-ja-JP ]; then
            echo "::error::$NOTES_FILE の先頭コードフェンス（最新情報）が空です。"
            exit 1
          fi
          echo "----- whatsnew (ja-JP) -----"
          cat whatsnew/whatsnew-ja-JP

      - name: Upload app (Wear) to Play (wear:internal track)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.marufeuille.hydra
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: wear:internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Upload companion (phone) to Play (internal track)
        if: github.ref_type == 'tag'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.marufeuille.hydra
          releaseFiles: companion/build/outputs/bundle/release/companion-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: whatsnew

      - name: Upload AAB artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-aabs
          path: |
            app/build/outputs/bundle/release/app-release.aab
            companion/build/outputs/bundle/release/companion-release.aab
